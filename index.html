<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TAGGY App | Dueños</title>
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22TAGGY%22%2C%22short_name%22%3A%22TAGGY%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23FFF8ED%22%2C%22theme_color%22%3A%22%23FFF8ED%22%7D">
<meta name="theme-color" content="#FFF8ED">
<link rel="icon" href="taggy-logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--cream:#FFF8ED;--orange:#EF8A27;--deep:#B85C14;--yellow:#F7C957;--sage:#86A79B;--blue:#9BC3CE;--coral:#D9826B;--black:#202020}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:"DM Sans",sans-serif;color:var(--black);background:#f1e4cf;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 12% 15%,#F7C957 0,transparent 28%),radial-gradient(circle at 90% 30%,#9BC3CE 0,transparent 26%),radial-gradient(circle at 40% 100%,#F3A18C 0,transparent 30%)}
h1,h2,h3,.b{font-family:"Baloo 2",sans-serif}
.app{max-width:430px;margin:auto;min-height:100vh;background:var(--cream);position:relative;padding-bottom:96px;box-shadow:0 0 70px rgba(0,0,0,.18);overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;position:sticky;top:0;z-index:20;background:rgba(255,248,237,.9);backdrop-filter:blur(12px)}
.top img{height:38px}
.circ{width:42px;height:42px;border-radius:50%;border:0;background:var(--orange);font-size:1.1rem;cursor:pointer}
.screen{display:none;padding:6px 18px;animation:up .5s cubic-bezier(.2,.7,.2,1)}
.screen.on{display:block}
.screen>*{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.screen>*:nth-child(2){animation-delay:.07s}.screen>*:nth-child(3){animation-delay:.14s}.screen>*:nth-child(4){animation-delay:.21s}.screen>*:nth-child(5){animation-delay:.28s}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.card{background:#fff;border-radius:28px;padding:18px;margin-bottom:14px;box-shadow:0 12px 30px rgba(0,0,0,.07)}
.tag{display:inline-block;background:var(--yellow);padding:6px 12px;border-radius:30px;font-size:.68rem;font-weight:800;letter-spacing:.04em}
.tag.lost{background:var(--coral);color:#fff;animation:blink 1s infinite}.tag.ok{background:var(--sage);color:#fff}
@keyframes blink{50%{transform:scale(1.07)}}
.pet{display:grid;grid-template-columns:104px minmax(0,1fr);gap:16px;align-items:center;padding:18px}
.photo{width:104px;height:104px;border-radius:24px;background:linear-gradient(140deg,var(--blue),var(--sage));display:grid;place-items:center;font-size:2.6rem;overflow:hidden;flex:none;border:3px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.10);position:relative;cursor:pointer}
.photo img{width:100%;height:100%;object-fit:cover}
.pet h2{font-size:2rem;line-height:1.05;margin:8px 0 10px}.pet-meta{display:grid;gap:5px;font-size:.85rem;color:#555}.pet-meta strong{color:var(--black)}
.species{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:30px;background:#EAF1EF;color:#315D50;font-size:.72rem;font-weight:800;width:max-content}
.shield{display:flex;align-items:center;gap:12px;background:var(--blue);cursor:pointer;font-weight:800}
.shield i{font-style:normal;width:40px;height:40px;border-radius:14px;background:var(--cream);display:grid;place-items:center}
.shield span{margin-left:auto;font-size:.75rem}
.label{font-size:.72rem;font-weight:800;letter-spacing:.06em;opacity:.6;margin:18px 4px 10px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{background:#fff;border:0;border-radius:22px;padding:14px 6px;font:700 .72rem "DM Sans";cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.06);transition:.2s}
.act:active{transform:scale(.93)}.act i{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--yellow);font-style:normal;font-size:1.2rem;margin:0 auto 8px}
.loc{display:flex;gap:16px;align-items:center;background:var(--yellow);transition:.4s}.loc.lost{background:var(--coral);color:#fff}
.loc p{font-size:.85rem;line-height:1.4;margin-top:3px}
.radar{width:104px;height:104px;flex:none;border-radius:50%;background:rgba(255,255,255,.5);position:relative;display:grid;place-items:center;overflow:hidden}
.ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--orange);opacity:0;animation:ping 2.8s ease-out infinite}
.ring:nth-child(2){animation-delay:.9s}.ring:nth-child(3){animation-delay:1.8s}
@keyframes ping{0%{transform:scale(.15);opacity:.9}100%{transform:scale(1);opacity:0}}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(239,138,39,.6),transparent 35%);animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pin{position:relative;z-index:2;width:40px;height:40px;border-radius:50%;background:var(--orange);display:grid;place-items:center;box-shadow:0 0 0 5px rgba(255,255,255,.75);animation:hop 1.4s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-6px)}}
.loc.lost .ring{border-color:#fff;animation-duration:1.3s}.loc.lost .sweep{animation-duration:1.2s;background:conic-gradient(rgba(255,255,255,.8),transparent 35%)}.loc.lost .pin{background:var(--coral)}
.btn{width:100%;padding:15px;border-radius:30px;border:1.5px solid var(--black);font:800 1rem "DM Sans";cursor:pointer;margin-top:10px;transition:.2s;position:relative;overflow:hidden}
.btn:active{transform:scale(.96)}.btn.p{background:var(--orange);border-color:var(--orange)}.btn.w{background:#fff}
.btn.sos{background:#fff;border-color:var(--coral);color:var(--coral)}.btn.sos.found{background:var(--sage);border-color:var(--sage);color:#fff}
.nfcbox{text-align:center;background:linear-gradient(160deg,#fff,#FCE8CC)}
.nfc{width:150px;height:150px;border-radius:50%;border:0;margin:14px auto;display:grid;place-items:center;position:relative;background:var(--deep);color:#fff;font:800 1.2rem "Baloo 2";cursor:pointer;box-shadow:0 0 0 14px rgba(239,138,39,.25),0 0 0 30px rgba(239,138,39,.12);animation:breathe 3s ease-in-out infinite}
.nfc small{display:block;font:600 .65rem "DM Sans";opacity:.8}
.nfc.linking{animation:linking .5s ease-in-out 4}
@keyframes breathe{50%{transform:scale(1.06)}}@keyframes linking{50%{transform:scale(1.18);background:var(--orange)}}
.web{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.web a{background:#fff;border-radius:22px;padding:16px;font-weight:800;text-decoration:none;color:inherit;box-shadow:0 8px 20px rgba(0,0,0,.06);transition:.2s}
.web a:active{transform:scale(.95)}.web a:nth-child(1){background:var(--yellow)}.web a:nth-child(2){background:var(--blue)}.web a:nth-child(3){background:#F3C9BC}
.rec{border-radius:22px;padding:16px;margin-bottom:12px;background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.06)}
.rec.alert{background:#FBE3DD;border-left:6px solid var(--coral)}
.rec small{font-weight:800;font-size:.68rem;letter-spacing:.04em;opacity:.7}.rec h3{font-size:1.25rem;margin:4px 0}.rec p{font-size:.85rem;line-height:1.5}
.seg{display:flex;background:#F4E8D4;border-radius:30px;padding:4px;margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;padding:11px;border-radius:30px;font:800 .85rem "DM Sans";cursor:pointer;transition:.25s}.seg .on{background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.pane{display:none}.pane.on{display:block}
label{display:block;font-weight:700;font-size:.8rem;margin:14px 0 6px}
input,select,textarea{width:100%;padding:13px 14px;border-radius:15px;border:1.5px solid rgba(32,32,32,.12);background:var(--cream);font:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(239,138,39,.18)}
textarea{min-height:90px;resize:vertical}
.pick{display:flex;gap:8px}.pick button{flex:1;padding:12px;border:0;border-radius:14px;background:var(--cream);font:800 .85rem "DM Sans";cursor:pointer}.pick .on{background:var(--deep);color:#fff}
.sw{display:flex;align-items:center;gap:12px;background:var(--cream);border-radius:16px;padding:12px 14px;margin-top:14px;font-size:.85rem;font-weight:700}
.sw button{margin-left:auto;width:50px;height:28px;border-radius:20px;border:0;background:#ccc;position:relative;cursor:pointer;flex:none;transition:.3s}
.sw button::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.3s}.sw button.on{background:var(--deep)}.sw button.on::after{left:25px}
.traits{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.traits span{background:#FCE8CC;padding:8px 12px;border-radius:20px;font-size:.8rem;font-weight:700}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:flex;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-radius:28px 28px 0 0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.08);z-index:30}
.nav button{flex:1;border:0;background:none;font:800 .72rem "DM Sans";color:#999;cursor:pointer;padding:6px;transition:.25s}.nav i{display:block;font-style:normal;font-size:1.4rem;transition:.25s}
.nav .on{color:var(--deep)}.nav .on i{transform:translateY(-4px) scale(1.15)}
.sheetbg{position:fixed;inset:0;background:rgba(32,32,32,.5);backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-end;justify-content:center;overscroll-behavior:contain;touch-action:pan-y}.sheetbg.on{display:flex} body.sheet-open{overflow:hidden;touch-action:none}
.sheet{width:min(430px,100%);background:var(--cream);border-radius:34px 34px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom));animation:sheet .4s cubic-bezier(.2,.9,.3,1);max-height:90dvh;max-height:90vh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
@keyframes sheet{from{transform:translateY(100%)}}
.sheet h3{font-size:1.6rem;margin:10px 0 4px}.row{display:flex;gap:10px}.row .btn{flex:1}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,150px);background:var(--black);color:#fff;padding:14px 22px;border-radius:30px;font-weight:700;font-size:.9rem;z-index:99;transition:transform .5s cubic-bezier(.2,1.4,.4,1);max-width:88%;text-align:center}.toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
#map{height:220px;border-radius:20px;isolation:isolate;background:#e8dcc6}
.mapaddr{font-size:.85rem;font-weight:700;margin:10px 4px 2px}
.pinm{width:54px;height:54px;border-radius:50%;background:#fff;border:3px solid var(--orange);display:grid;place-items:center;font-size:1.7rem;box-shadow:0 6px 16px rgba(0,0,0,.3);position:relative}
.pinm img{width:100%;height:100%;border-radius:50%;object-fit:cover;padding:5px}.pinm.ph img{padding:0}
.pinm::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--orange);animation:pinring 2s ease-out infinite}
.pinm.lost{border-color:var(--coral)}.pinm.lost::after{border-color:var(--coral);animation-duration:1s}
@keyframes pinring{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.3);opacity:0}}
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.icons button{aspect-ratio:1;border:2px solid transparent;border-radius:18px;background:#fff;font-size:1.8rem;cursor:pointer;display:grid;place-items:center}
.icons button.on{border-color:var(--orange);background:#FCE8CC}.icons img{width:78%;height:78%;object-fit:cover;border-radius:50%}
.fh{background:var(--orange);color:#fff;font:800 .78rem "DM Sans";letter-spacing:.05em;padding:9px 12px;border-radius:10px;margin:20px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.ck{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.84rem;margin:7px 0}
.ck input{width:20px;height:20px;padding:0;accent-color:var(--deep);flex:none}
.sub{font-weight:800;font-size:.8rem;margin:12px 0 2px;color:var(--deep)}
.auto{background:#fff;border-radius:14px;padding:12px 14px;font-size:.85rem;line-height:1.7;margin-top:8px}
.circ{overflow:hidden;padding:0}.circ img{width:100%;height:100%;object-fit:cover}
.photo img{object-position:center 65%}
.map-card{padding:18px;border:1px solid rgba(32,32,32,.05);box-shadow:0 14px 34px rgba(0,0,0,.08)}
.map-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.map-heading h3{font-size:1.35rem;margin:0}
.map-heading p{font-size:.8rem;line-height:1.4;color:#777;margin-top:3px}
.map-badge{white-space:nowrap;background:#EAF1EF;color:#315D50;padding:7px 10px;border-radius:20px;font-size:.68rem;font-weight:800}
#map{height:270px;border-radius:20px;isolation:isolate;background:#e8dcc6}
.mapaddr{font-size:.86rem;font-weight:700;margin:12px 4px 2px;line-height:1.45}
.map-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.map-actions .btn{margin:0}
.nfcbox{padding:22px;background:linear-gradient(160deg,#fff,#FCE8CC);border:1px solid rgba(184,92,20,.08)}
.nfcbox h3{margin:10px 0 4px;font-size:1.35rem}
.nfcbox p{font-size:.85rem;line-height:1.5;color:#666;max-width:290px;margin:0 auto}
.nfc{width:126px;height:126px;margin:18px auto 14px}
@media(max-width:360px){.pet{grid-template-columns:84px minmax(0,1fr);gap:12px}.photo{width:84px;height:84px;border-radius:20px}.pet h2{font-size:1.7rem}.map-actions{grid-template-columns:1fr}}


/* ===== OPTIMIZACIÓN DE RENDIMIENTO TAGGY ===== */
/* Evita animaciones permanentes que consumen recursos en móviles. */
.screen,
.screen > * {
  animation: none !important;
}
.screen.on {
  animation: taggyScreenIn .18s ease-out both !important;
}
@keyframes taggyScreenIn {
  from { opacity: .92; }
  to { opacity: 1; }
}
.tag.lost {
  animation: none !important;
}
.ring, .sweep, .pin, .pinm::after {
  animation: none !important;
}
.nfc {
  animation: none !important;
  box-shadow: 0 0 0 10px rgba(239,138,39,.16);
  transition: transform .18s ease, background-color .18s ease;
}
.nfc:active {
  transform: scale(.97);
}
.nfc.linking {
  animation: none !important;
  background: var(--orange);
  transform: scale(1.03);
}
.top, .nav, .sheetbg {
  -webkit-backdrop-filter: none !important;
  backdrop-filter: none !important;
}
.top { background: #FFF8ED; }
.nav { background: rgba(255,255,255,.98); }
.sheetbg { background: rgba(32,32,32,.58); }
.sheet { animation: none !important; }
.btn, .web a, .nav button, .nav i, .seg button, .sw button {
  transition-duration: .15s;
}
html { scroll-behavior: auto; }
@media (max-width: 600px) {
  .card { box-shadow: 0 6px 18px rgba(0,0,0,.055); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

</style>
</head>
<body>
<div class="app">
  <div class="top"><img src="taggy-logo.png" alt="TAGGY"><button class="circ" id="av" onclick="go('profile')" aria-label="Perfil">👤</button></div>
  <main>
    <section class="screen on" id="home"></section>
    <section class="screen" id="health"></section>
    <section class="screen" id="profile"></section>
  </main>
  <nav class="nav">
    <button data-t="home" class="on"><i>🐾</i>Mascotas</button>
    <button data-t="health"><i>🩺</i>Salud</button>
    <button data-t="profile"><i>👤</i>Perfil</button>
  </nav>
</div>
<div class="sheetbg" id="bg" aria-hidden="true"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Menú"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>

<script>
/* ===== CAMBIA ESTA LÍNEA: dirección de tu página web TAGGY (termina con /) ===== */
const WEB="https://vale95uicab.github.io/Taggy/";

const $=s=>document.querySelector(s),K="taggyApp";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DEF={shield:true,lost:null,
 pet:{name:"Catalino",species:"Perro",breed:"Shih Tzu",sex:"Macho",birth:"2025-05-14",neutered:true,photo:"catalino.jpg",photoUrl:"catalino.jpg",alerts:["Alergia a la penicilina: reacción grave, avisar al veterinario","Dieta especial gastrointestinal: solo alimento indicado por su veterinario"],note:"No ofrecer alimentos con harinas ni golosinas artificiales. Es amigable con niños y otros perros.",chip:true,icon:"🐶",id:"#TG-9204",tags:["Amigable","Juguetón","Teme a pirotecnia","Sociable con perros"]},
 tutor:{photo:"",ref:"Hospital IMSS cercano",name:"Valentina Palomino",phone:"(999) 123-4567",email:"vale.palo@gmail.com",coName:"Juanito Alcachofas",coPhone:"(999) 987-6543",city:"Mérida, Yucatán",zone:"Fracc. Los Héroes",hide:true},
 loc:{lat:21.11056,lng:-89.61139,label:"Universidad Anáhuac Mayab, Mérida, Yucatán"},clin:{},
 health:[{k:"alert",t:"Alergia severa a la penicilina",d:"2024-10-12",n:"Reacción anafiláctica previa reportada. No suministrar derivados de betalactámicos."},
         {k:"visit",t:"Visita y chequeo anual",d:"2024-10-12",n:"Hospital Veterinario del Norte"},
         {k:"vac",t:"Vacuna séxtuple canina (DHPPi)",d:"2024-10-12",n:"Dosis 2024-2025. Tolera sin reacciones adversas locales."}]};
let S;try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){S={}}
S={...DEF,...S,pet:{...DEF.pet,...S.pet},tutor:{...DEF.tutor,...S.tutor},loc:{...DEF.loc,...S.loc},clin:{...S.clin}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast("No se pudo guardar (foto muy grande)")}};
if(S.pet.name==="Dember"&&/DEMBER/.test(S.pet.id||"")){S.pet.name="Catalino";S.pet.id="#TG-9204";S.pet.photo="catalino.jpg";S.pet.photoUrl="catalino.jpg";save()}
let tt;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),3000)}
const fdate=d=>new Date(d+"T12:00").toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"});
function age(d){const b=new Date(d),n=new Date();let m=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth();if(m<12)return m+" meses";const y=Math.floor(m/12);return y+(y==1?" año":" años")}
function go(t){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id==t));document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));window.scrollTo(0,0)}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
function sheet(h){
  const bg=$("#bg");
  $("#sheet").innerHTML=h;
  bg.classList.add("on");
  bg.setAttribute("aria-hidden","false");
  document.body.classList.add("sheet-open");
}
function closeSheet(){
  const bg=$("#bg");
  if(!bg || !bg.classList.contains("on")) return;
  bg.classList.remove("on");
  bg.setAttribute("aria-hidden","true");
  document.body.classList.remove("sheet-open");
}
window.closeSheet=closeSheet;
// Cerrar únicamente al tocar el fondo; tocar dentro del panel no lo cierra.
$("#bg").addEventListener("click",e=>{if(e.target===$("#bg"))closeSheet()});
$("#sheet").addEventListener("click",e=>e.stopPropagation());
const photo=(p,big)=>`<div class="photo" onclick="pickPhoto('pet')" title="Cambiar foto">${p.photo?`<img src="${p.photo}" alt="">`:"🐶"}</div>`;

function home(){homeR();av();setTimeout(initMap,0)}
function homeR(){const p=S.pet,l=S.lost;
const speciesIcon=p.species==="Gato"?"🐱":p.species==="Perro"?"🐶":"🐾";
$("#home").innerHTML=`
<div class="card pet">
 ${photo(p)}
 <div>
  <span class="species">${speciesIcon} ${esc(p.species||"Mascota")}</span>
  <h2>${esc(p.name)}</h2>
  <div class="pet-meta">
   <span><strong>Raza:</strong> ${esc(p.breed||"No especificada")}</span>
   <span><strong>Edad:</strong> ${esc(age(p.birth))}</span>
  </div>
  ${l?`<span class="tag lost" style="margin-top:10px">🚨 REPORTE DE EXTRAVÍO ACTIVO</span>`:""}
 </div>
</div>

<div class="card map-card">
 <div class="map-heading">
  <div><h3>Ubicación de ${esc(p.name)}</h3><p>Consulta y actualiza la ubicación registrada de tu mascota.</p></div>
  <span class="map-badge">📍 MAPA</span>
 </div>

function link(){const n=$("#nfc");n.classList.add("linking");$("#nfcT").textContent="Leyendo la placa…";setTimeout(()=>{n.classList.remove("linking");$("#nfcT").textContent="✓ Lectura NFC simulada correctamente";toast("Lectura de placa simulada 🐾")},2100)}
function scanLink(){const p=S.pet,t=S.tutor,o={n:p.name,b:p.breed,a:age(p.birth),x:p.sex+(p.neutered?(p.sex=="Hembra"?" esterilizada":" esterilizado"):""),id:p.id,f:p.photoUrl||"",i:p.icon=="foto"?"🐶":p.icon,o:t.name,t:t.phone,u:t.coPhone,z:t.zone+", "+t.city,r:t.hide?"":t.ref,al:p.alerts,nt:p.note,mc:p.chip?1:0,rw:S.lost?S.lost.rw:"",ld:S.lost?S.lost.dt:"",lz:S.lost?S.lost.zone:S.loc.label};
 return location.origin+location.pathname.replace(/[^/]*$/,"")+"scan.html#d="+btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function nfcSheet(){sheet(`<span class="tag">FICHA DIGITAL · NFC / QR</span><h3>Ficha pública de ${esc(S.pet.name)}</h3><p style="font-size:.85rem;margin:6px 0 10px">Esto es lo que verá la persona que acerque su celular a la placa o escanee el código QR: foto, datos básicos, alertas y formas de contactarte. No incluye el historial clínico.</p>${S.lost?`<p style="font-size:.85rem;font-weight:700;color:var(--coral);margin-bottom:8px">🚨 Actualiza el enlace de la placa o el código QR para mostrar la recompensa y la última zona reportada.</p>`:""}<label>Enlace de la fotografía (opcional)</label><input id="pu" placeholder="https://..." value="${esc(S.pet.photoUrl||"")}" oninput="nfcUpd()"><label>Enlace de la ficha pública</label><textarea id="lk" readonly style="min-height:80px;font-size:.7rem"></textarea><div id="qr" style="display:grid;place-items:center;margin:12px 0"></div><div class="row"><button class="btn w" onclick="copyLk()">Copiar enlace</button><button class="btn p" onclick="window.open($('#lk').value)">Vista pública</button></div><button class="btn w" onclick="closeSheet()">Cerrar</button>`);nfcUpd()}
function nfcUpd(){S.pet.photoUrl=$("#pu").value.trim();save();const l=scanLink();$("#lk").value=l;const q=$("#qr");q.innerHTML="";try{new QRCode(q,{text:l,width:170,height:170,correctLevel:QRCode.CorrectLevel.L})}catch(e){q.innerHTML="<small>No se pudo crear el QR (sin internet o enlace muy largo).</small>"}}
async function copyLk(){
 const value=$("#lk").value;
 try{
   if(navigator.clipboard && window.isSecureContext){
     await navigator.clipboard.writeText(value);
     toast("Enlace copiado ✓");
     return;
   }
 }catch(e){}
 const temp=document.createElement("textarea");
 temp.value=value;temp.setAttribute("readonly","");
 temp.style.position="fixed";temp.style.opacity="0";
 document.body.appendChild(temp);temp.select();
 let ok=false;try{ok=document.execCommand("copy")}catch(e){}
 temp.remove();
 toast(ok?"Enlace copiado ✓":"Mantén presionado el enlace para copiarlo");
}

function sendLost(e){e.preventDefault();const p=S.pet,t=S.tutor,zone=$("#lz").value.trim(),rw=$("#lr").value.trim(),dt=$("#ld").value,m=$("#lm").value.trim();
 let r=[];try{r=JSON.parse(localStorage.getItem("taggyReports"))||[]}catch(x){}

 localStorage.setItem("taggyReports",JSON.stringify(r));S.lost={zone,rw,dt};save();home();nfcSheet();toast("Reporte enviado a la página web 🚨")}

/* ===== Mapa y ubicación ===== */
let map,mk;
function pinHtml(){const p=S.pet,i=p.icon,f=i=="foto"&&p.photo;const c=f?`<img src="${p.photo}" alt="">`:i=="foto"?"🐾":i=="perro"?"🐶":i=="gato"?"🐱":i;return `<div class="pinm ${f?"ph":""} ${S.lost?"lost":""}">${c}</div>`}
function initMap(){
 const el=$("#map");
 if(!el)return;
 if(typeof L==="undefined"){
   el.innerHTML='<p style="padding:20px;font-weight:700">Conéctate a internet para ver el mapa 🗺️</p>';
   return;
 }
 const ll=[S.loc.lat,S.loc.lng];
 const icon=L.divIcon({html:pinHtml(),className:"",iconSize:[54,54],iconAnchor:[27,27]});
 if(map){
   map.setView(ll,16,{animate:false});
   if(mk){
     mk.setLatLng(ll);
     mk.setIcon(icon);
   } else {
     mk=L.marker(ll,{icon}).addTo(map);
   }
   map.invalidateSize({pan:false});
   return;
 }
 map=L.map(el,{zoomControl:false,preferCanvas:true,fadeAnimation:false,markerZoomAnimation:false}).setView(ll,16);
 L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
   maxZoom:19,
   updateWhenIdle:true,
   updateWhenZooming:false,
   keepBuffer:2,
   attribution:"© OpenStreetMap"
 }).addTo(map);
 mk=L.marker(ll,{icon}).addTo(map);
 map.on("click",e=>{
   S.loc.lat=e.latlng.lat;
   S.loc.lng=e.latlng.lng;
   S.loc.label="Punto marcado en el mapa";
   save();
   mk.setLatLng(e.latlng);
   const address=document.querySelector(".mapaddr");
   if(address)address.textContent="📍 "+S.loc.label;
   toast("Ubicación movida. Puedes editar la dirección en Cambiar ubicación");
 });
}

function clinSheet(){const p=S.pet,t=S.tutor;
 sheet(`<span class="tag">HISTORIA CLÍNICA VETERINARIO</span><h3>Ficha de ${esc(p.name)}</h3><form onsubmit="saveClin(event)">
 <div class="fh">ESPACIO A RELLENAR POR EL LABORATORIO</div><div class="g2">${CL.lab.map(k=>tf("lab:"+k,k)).join("")}</div>
